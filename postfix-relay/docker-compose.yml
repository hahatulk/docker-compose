services:
  pantum-relay:
    image: boky/postfix:latest
    container_name: smtp-relay
    restart: unless-stopped
    ports:
      - "2525:587"
    environment:
      POSTFIX_myhostname: "gw.domain.ru"
      POSTFIX_smtpd_sasl_auth_enable: "yes"
      POSTFIX_smtpd_tls_auth_only: "no"
      POSTFIX_smtpd_relay_restrictions: "permit_sasl_authenticated, reject"
      POSTFIX_mynetworks: "127.0.0.0/8, 192.168.1.50/32"
      POSTFIX_smtpd_tls_security_level: "none"
      ALLOWED_SENDER_DOMAINS: "domain.ru"
      RELAYHOST: "[mail.domain.ru]:587"
      RELAYHOST_TLS_LEVEL: "verify"
      RELAYHOST_USERNAME: "noreply@domain.ru"
      RELAYHOST_PASSWORD_FILE: "/run/secrets/stalwart_password"
      POSTFIX_smtp_tls_security_level: "verify"
      POSTFIX_smtp_tls_CAfile: "/etc/ssl/certs/ca-certificates.crt"
      SMTPD_SASL_USERS: "noreply@domain.ru:password"
    secrets:
      - stalwart_password

secrets:
  stalwart_password:
    file: ./stalwart_password.txt
